# GACL ("GAIL-Constraint") on LapGridWorld: Malik et al.'s README command
# (docs/methods.md §3), compared with Figure 3a's GC curve (docs/results.md):
# run_me.py gail -er 20 -ep icrl/expert_data/LGW -tei LGW-v0 -eei CLGW-v0
# -tk 0.01 -dl 20 -dlr 0.01 -t 120000 --n_steps 2000 -dno -dnr -lc
# -dno -dnr: our PPO doesn't normalise. -lc: log D is added to the reward
# (what run_gacl does). Unset = his CLI defaults (icrl/gail.py argparse).
nominal_env: {name: lap_grid_world}                   # -tei LGW-v0
eval_env: {name: lap_grid_world, constrained: true}   # -eei CLGW-v0
true_cost: {name: lap_grid_world}
featurizer: {name: lap_grid_world}
expert: expert_data/lgw_forward.pkl                   # -er 20: 20 trajectories
n_envs: 5                                             # -nt default 5
agent:
  name: ppo
  target_kl: 0.01                                     # -tk
  n_steps: 2000                                       # --n_steps: 5 x 2000 = 10,000 steps per rollout
method:
  name: gacl
  hidden_sizes: [20]                                  # -dl 20
  learning_rate: 0.01                                 # -dlr
  # The discriminator sees [cell, cell, is_forward], as Malik's does by a
  # bug (docs/methods.md, "Bugs in the official code" (2)).
  input_columns: [0, 0, 1]
loop:
  name: gacl
  total_steps: 120000                                 # -t: 12 rollouts, 12 discriminator updates
seed: 0
