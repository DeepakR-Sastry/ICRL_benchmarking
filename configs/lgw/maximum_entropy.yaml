# Maximum Entropy ICRL on LapGridWorld, schedule B: the one that reproduces
# Malik et al.'s Figure 3a (docs/methods.md, docs/results.md).
# Malik's README command: -er 20 -tk 0.01 -cl 20 -clr 0.003 -bi 20 -dno -dnr
# -dnc -tei LGW-v0 -eei CLGW-v0; schedule B replaces his -ni 10 -ft 0.5e5
# with -ni 12 -ft 1e4, as the figure's x-axis implies. Unset = his CLI defaults.
nominal_env: {name: lap_grid_world}                   # -tei LGW-v0
eval_env: {name: lap_grid_world, constrained: true}   # -eei CLGW-v0
true_cost: {name: lap_grid_world}
featurizer: {name: lap_grid_world}
expert: expert_data/lgw_forward.pkl                   # -er 20: 20 trajectories
n_envs: 5
agent:
  name: ppo_lagrangian
  target_kl: 0.01                                     # -tk
method:
  name: maximum_entropy
  hidden_sizes: [20]                                  # -cl 20
  learning_rate: 0.003                                # -clr
  backward_iters: 20                                  # -bi
  # The network sees [cell, cell, is_forward], as Malik's does by a bug
  # (docs/methods.md, "Bugs in the official code" (2)).
  input_columns: [0, 0, 1]
loop:
  n_rounds: 12                                        # -ni
  steps_per_round: 10000                              # -ft
seed: 0
