[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icrl-bench"
version = "0.1.0"
description = "Inverse Constraint RL methods and a fair way to compare them."
requires-python = ">=3.13"
dependencies = [
    "gymnasium[mujoco]",
    "numpy",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = ["matplotlib", "pytest", "wandb"]
validate = ["stable-baselines3"]

[tool.setuptools.packages.find]
include = ["icrl_bench*"]
